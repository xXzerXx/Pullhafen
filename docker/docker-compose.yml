services:
  pullhafen:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    # Echt notwendig, kein Cargo-Cult: ohne init-Prozess ist der Container-
    # Start (PID 1) ein einfaches 'sh', das verwaiste Kindprozesse NICHT
    # reapt. yt-dlps ffmpeg-Postprocessing (Metadaten/Vorschaubild) kann bei
    # großen Dateien einen Grandchild-Prozess hinterlassen, der die
    # stdout/stderr-Pipe offen hält - Pythons subprocess.communicate()
    # wartet dann für immer auf select(), obwohl die eigentliche Arbeit
    # längst fertig ist (echt reproduziert und mit py-spy nachgewiesen,
    # siehe Commit-Message). Dockers eingebauter --init/tini behebt genau
    # das, ohne eine weitere Fremdabhängigkeit ins Image zu bauen.
    init: true
    environment:
      # Nur beim allerersten Start wirksam (siehe app/services/auth.py) -
      # ein späterer Neustart mit anderen Werten überschreibt ein bereits
      # gesetztes Passwort NICHT. admin/admin ist hier bewusst der Standard:
      # die Oberfläche erzwingt direkt nach dem ersten Login ein eigenes
      # Passwort, bevor irgendetwas anderes benutzbar ist (siehe
      # must_change_password in app/services/auth.py).
      PULLHAFEN_ADMIN_USERNAME: admin
      PULLHAFEN_ADMIN_PASSWORD: admin
    volumes:
      # Ein einziger Mount reicht - Pullhafen legt data/ und downloads/
      # darin selbst an (siehe PULLHAFEN_DATA_DIR/PULLHAFEN_DOWNLOADS_DIR
      # im Dockerfile). Wer Downloads auf einem eigenen, separaten Dataset
      # haben will, mountet stattdessen zusätzlich einen zweiten Pfad auf
      # /appdata/downloads statt auf den gemeinsamen Elternordner.
      - pullhafen_appdata:/appdata
    restart: unless-stopped

volumes:
  pullhafen_appdata:
